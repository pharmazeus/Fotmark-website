packages:
  - web
  - studio

# Dependency build scripts are blocked unless allowed here (pnpm 11+).
# All of these ship prebuilt binaries, so their install scripts aren't needed.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false

# Security patches for transitive deps of the Sanity CLI (tooling only, never shipped to
# visitors), within the same major. Drop each line once sanity/next-sanity ship the fix.
overrides:
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "smol-toml@<1.7.1": "^1.7.1"
  "undici@>=7.18.0 <7.30.1": "7.30.1"
